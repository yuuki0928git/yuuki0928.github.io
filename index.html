<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="堀越 優輝（HORIKOSHI YUUKI）— はじめまして。InstagramやLINE、メールでつながれます。">
  <title>HORIKOSHI YUUKI</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ec;
      --ink: #2c4536;
      --sage: #a8b8a2;
      --sage-soft: #e3e8dd;
      --sand: #e7dcc5;
      --muted: #75806f;
      --line: #d9d6cb;
      --serif: Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.8;
      -webkit-text-size-adjust: 100%;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

    .page {
      min-height: 100%;
      width: min(100% - 40px, 520px);
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      padding: 24px 0 28px;
    }
    .mark {
      font-family: var(--serif);
      font-size: 15px;
      letter-spacing: .12em;
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; }
    .lang { display: flex; align-items: center; gap: 4px; font-size: 12px; letter-spacing: .12em; color: var(--muted); }
    .lang button {
      min-width: 40px; min-height: 40px; padding: 0;
      border: 0; background: none; font: inherit; letter-spacing: inherit;
      color: var(--muted); cursor: pointer;
    }
    .lang button[aria-pressed="true"] { color: var(--ink); border-bottom: 1px solid var(--ink); }
    .lang button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    main { flex: 1; padding: 32px 0 40px; }

    /* 重なり合う円 */
    .shapes {
      position: relative;
      width: min(46vw, 190px);
      aspect-ratio: 1;
      margin: 0 0 28px;
    }
    .shapes span { position: absolute; border-radius: 50%; mix-blend-mode: multiply; }
    .shapes .c1 { width: 64%; aspect-ratio: 1; left: 0; top: 8%; background: var(--sage); }
    .shapes .c2 { width: 52%; aspect-ratio: 1; right: 0; top: 0; background: var(--sand); }
    .shapes .c3 { width: 40%; aspect-ratio: 1; left: 38%; bottom: 0; background: var(--ink); opacity: .9; }
    .shapes .c4 {
      width: 78%; aspect-ratio: 1; left: 10%; top: 14%;
      border: 1px solid var(--ink); background: none; mix-blend-mode: normal; opacity: .28;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(24px, 7vw, 34px);
      line-height: 1.2;
      letter-spacing: .04em;
    }
    .jp { margin: 6px 0 0; font-size: 13px; letter-spacing: .24em; color: var(--muted); }

    .hello { margin: 32px 0 0; font-size: 14px; color: #3f5646; }
    .hello p { margin: 0 0 6px; }

    .connect-label {
      margin: 40px 0 8px;
      font-size: 12px;
      letter-spacing: .2em;
      color: var(--muted);
    }
    .links { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .links li { border-bottom: 1px solid var(--line); }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 68px;
      padding: 10px 6px;
      transition: background-color .2s ease;
    }
    .row:hover { background: var(--sage-soft); }
    .row .name { display: block; font-size: 16px; letter-spacing: .06em; }
    .row .note { display: block; font-size: 12px; color: var(--muted); letter-spacing: .02em; word-break: break-all; }
    .row .arrow { flex: none; font-size: 16px; }

    footer {
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      letter-spacing: .12em;
      color: var(--muted);
    }
    @media (min-width: 640px) {
      .page { padding-top: 36px; padding-bottom: 36px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .row { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="mark" href="#top" aria-label="HORIKOSHI YUUKI">YH.</a>
      <div class="lang" role="group" aria-label="Language / 言語">
        <button type="button" data-lang="ja" aria-pressed="true">JA</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>

    <main id="top">
      <div class="shapes" aria-hidden="true">
        <span class="c1"></span>
        <span class="c2"></span>
        <span class="c3"></span>
        <span class="c4"></span>
      </div>

      <h1>HORIKOSHI YUUKI</h1>
      <p class="jp">堀越 優輝</p>

      <div class="hello">
        <p data-ja="はじめまして、堀越優輝です。" data-en="Hello, I'm Yuuki Horikoshi.">はじめまして、堀越優輝です。</p>
        <p data-ja="名刺を受け取ってくださり、ありがとうございます。" data-en="Thank you for taking my card.">名刺を受け取ってくださり、ありがとうございます。</p>
        <p data-ja="好きな方法で、気軽につながってください。" data-en="Feel free to connect in whichever way suits you.">好きな方法で、気軽につながってください。</p>
      </div>

      <p class="connect-label" data-ja="つながる" data-en="Connect">つながる</p>
      <ul class="links">
        <li>
          <a class="row" href="https://line.me/ti/p/idQRszzabW" target="_blank" rel="noopener noreferrer">
            <span><span class="name">LINE</span><span class="note" data-ja="友だち追加はこちらから" data-en="Add me as a friend">友だち追加はこちらから</span></span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
        <li>
          <a class="row" href="https://www.instagram.com/yuuki.0928/" target="_blank" rel="noopener noreferrer">
            <span><span class="name">Instagram</span><span class="note" data-ja="フォロー・DMはこちらから" data-en="Follow or send a DM">フォロー・DMはこちらから</span></span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
        <li>
          <a class="row" href="https://wa.me/yuuki.0928?s=p" target="_blank" rel="noopener noreferrer">
            <span><span class="name">WhatsApp</span><span class="note" data-ja="メッセージはこちらから" data-en="Send me a message">メッセージはこちらから</span></span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
        <li>
          <a class="row" href="mailto:yukkiyuyutarou@gmail.com">
            <span><span class="name" data-ja="メール" data-en="Email">メール</span><span class="note">yukkiyuyutarou@gmail.com</span></span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
      </ul>
    </main>

    <footer>© HORIKOSHI YUUKI</footer>
  </div>

  <script>
    (function () {
      var buttons = document.querySelectorAll('.lang button');
      var items = document.querySelectorAll('[data-ja]');

      function apply(lang) {
        document.documentElement.lang = lang;
        items.forEach(function (el) { el.textContent = el.getAttribute('data-' + lang); });
        buttons.forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
        });
      }

      function initial() {
        var q = new URLSearchParams(location.search).get('lang');
        if (q === 'ja' || q === 'en') return q;
        try {
          var saved = localStorage.getItem('lang');
          if (saved === 'ja' || saved === 'en') return saved;
        } catch (e) {}
        return (navigator.language || 'ja').toLowerCase().indexOf('ja') === 0 ? 'ja' : 'en';
      }

      buttons.forEach(function (b) {
        b.addEventListener('click', function () {
          var lang = b.getAttribute('data-lang');
          apply(lang);
          try { localStorage.setItem('lang', lang); } catch (e) {}
        });
      });

      apply(initial());
    })();
  </script>
</body>
</html>
