<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="YUUKI HORIKOSHI（堀越 優輝）— InstagramとLINEへのリンク。">
  <title>YUUKI HORIKOSHI</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ec;
      --ink: #2c4536;
      --sage: #a8b8a2;
      --sage-soft: #c9d4c3;
      --sand: #e7dcc5;
      --muted: #7a8579;
      --line: #d9d6cb;
      --serif: Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.7;
      -webkit-text-size-adjust: 100%;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

    .page {
      min-height: 100%;
      width: min(100% - 40px, 560px);
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      padding: 24px 0 28px;
    }

    .mark {
      font-family: var(--serif);
      font-size: 15px;
      letter-spacing: .12em;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px 0 36px;
    }

    /* 重なり合う円 */
    .shapes {
      position: relative;
      width: min(72vw, 300px);
      aspect-ratio: 1;
      margin: 0 0 34px;
    }
    .shapes span {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: multiply;
    }
    .shapes .c1 { width: 64%; aspect-ratio: 1; left: 0; top: 8%; background: var(--sage); }
    .shapes .c2 { width: 52%; aspect-ratio: 1; right: 0; top: 0; background: var(--sand); }
    .shapes .c3 { width: 40%; aspect-ratio: 1; left: 38%; bottom: 0; background: var(--ink); opacity: .9; }
    .shapes .c4 {
      width: 78%; aspect-ratio: 1; left: 10%; top: 14%;
      border: 1px solid var(--ink); background: none; mix-blend-mode: normal; opacity: .28;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(40px, 12.5vw, 76px);
      line-height: 1.04;
      letter-spacing: -.02em;
    }
    .jp {
      margin: 14px 0 0;
      font-size: 13px;
      letter-spacing: .24em;
      color: var(--muted);
    }

    .links {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 40px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 54px;
      padding: 0 22px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      font-size: 14px;
      letter-spacing: .08em;
      transition: background-color .2s ease, color .2s ease;
    }
    .btn.primary { background: var(--ink); color: var(--bg); }
    .btn.primary:hover { background: #3d5c49; }
    .btn.ghost:hover { background: var(--sage-soft); }
    .btn .arrow { font-size: 15px; }

    footer {
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      letter-spacing: .12em;
      color: var(--muted);
    }

    @media (min-width: 640px) {
      .page { padding-top: 36px; padding-bottom: 36px; }
      .links { grid-template-columns: 1fr 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <a class="mark" href="#top" aria-label="YUUKI HORIKOSHI">YH.</a>

    <main id="top">
      <div class="shapes" aria-hidden="true">
        <span class="c1"></span>
        <span class="c2"></span>
        <span class="c3"></span>
        <span class="c4"></span>
      </div>

      <h1>YUUKI<br>HORIKOSHI</h1>
      <p class="jp">堀越 優輝</p>

      <nav class="links" aria-label="リンク">
        <a class="btn primary" href="https://www.instagram.com/yuuki.0928/" target="_blank" rel="noopener noreferrer">
          <span>Instagram</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="btn ghost" href="https://line.me/ti/p/idQRszzabW" target="_blank" rel="noopener noreferrer">
          <span>LINE</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </main>

    <footer>© YUUKI HORIKOSHI</footer>
  </div>
</body>
</html>
