<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="description" content="堀越 優輝（YUUKI HORIKOSHI）— はじめまして。InstagramやLINE、メールでつながれます。">
  <title>YUUKI HORIKOSHI</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ec;
      --ink: #2c4536;
      --sage: #a8b8a2;
      --sage-soft: #e3e8dd;
      --sand: #e7dcc5;
      --muted: #75806f;
      --line: #d9d6cb;
      --serif: Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.8;
      -webkit-text-size-adjust: 100%;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

    .page {
      min-height: 100%;
      width: min(100% - 40px, 520px);
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      padding: 24px 0 28px;
    }
    .mark {
      font-family: var(--serif);
      font-size: 15px;
      letter-spacing: .12em;
    }
    main { flex: 1; padding: 32px 0 40px; }

    /* 重なり合う円 */
    .shapes {
      position: relative;
      width: min(46vw, 190px);
      aspect-ratio: 1;
      margin: 0 0 28px;
    }
    .shapes span { position: absolute; border-radius: 50%; mix-blend-mode: multiply; }
    .shapes .c1 { width: 64%; aspect-ratio: 1; left: 0; top: 8%; background: var(--sage); }
    .shapes .c2 { width: 52%; aspect-ratio: 1; right: 0; top: 0; background: var(--sand); }
    .shapes .c3 { width: 40%; aspect-ratio: 1; left: 38%; bottom: 0; background: var(--ink); opacity: .9; }
    .shapes .c4 {
      width: 78%; aspect-ratio: 1; left: 10%; top: 14%;
      border: 1px solid var(--ink); background: none; mix-blend-mode: normal; opacity: .28;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(24px, 7vw, 34px);
      line-height: 1.2;
      letter-spacing: .04em;
    }
    .jp { margin: 6px 0 0; font-size: 13px; letter-spacing: .24em; color: var(--muted); }

    .hello { margin: 32px 0 0; font-size: 14px; color: #3f5646; }
    .hello p { margin: 0 0 6px; }

    .connect-label {
      margin: 40px 0 8px;
      font-size: 12px;
      letter-spacing: .2em;
      color: var(--muted);
    }
    .links { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .links li { border-bottom: 1px solid var(--line); }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 68px;
      padding: 10px 6px;
      transition: background-color .2s ease;
    }
    .row:hover { background: var(--sage-soft); }
    .row .name { display: block; font-size: 16px; letter-spacing: .06em; }
    .row .note { display: block; font-size: 12px; color: var(--muted); letter-spacing: .02em; word-break: break-all; }
    .row .arrow { flex: none; font-size: 16px; }

    footer {
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 10px;
      letter-spacing: .12em;
      color: var(--muted);
    }
    @media (min-width: 640px) {
      .page { padding-top: 36px; padding-bottom: 36px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .row { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <a class="mark" href="#top" aria-label="YUUKI HORIKOSHI">YH.</a>

    <main id="top">
      <div class="shapes" aria-hidden="true">
        <span class="c1"></span>
        <span class="c2"></span>
        <span class="c3"></span>
        <span class="c4"></span>
      </div>

      <h1>YUUKI HORIKOSHI</h1>
      <p class="jp">堀越 優輝</p>

      <div class="hello">
        <p>はじめまして、堀越優輝です。</p>
        <p>名刺を受け取ってくださり、ありがとうございます。</p>
        <p>好きな方法で、気軽につながってください。</p>
      </div>

      <p class="connect-label">つながる</p>
      <ul class="links">
        <li>
          <a class="row" href="https://line.me/ti/p/idQRszzabW" target="_blank" rel="noopener noreferrer">
            <span><span class="name">LINE</span><span class="note">友だち追加はこちらから</span></span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
        <li>
          <a class="row" href="https://www.instagram.com/yuuki.0928/" target="_blank" rel="noopener noreferrer">
            <span><span class="name">Instagram</span><span class="note">フォロー・DMはこちらから</span></span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
        <li>
          <a class="row" href="mailto:yukkiyuyutarou@gmail.com">
            <span><span class="name">メール</span><span class="note">yukkiyuyutarou@gmail.com</span></span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
      </ul>
    </main>

    <footer>© YUUKI HORIKOSHI</footer>
  </div>
</body>
</html>
